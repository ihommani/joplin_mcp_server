[project]
name = "joplin-mcp-server"
version = "0.1.0"
description = "MCP server exposing the Joplin REST API as tools"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
